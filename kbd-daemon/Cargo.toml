[package]
name = "kbd-daemon"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "cli"]

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
atspi = { version = "0.30.0", features = ["zbus"] }
env_logger = "0.11.11"
glib = "0.22.10"
gtk4 = { version = "0.11.5", features = ["v4_6"] }
gtk4-layer-shell = "0.8.1"
lazy_static = "1.5.1"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full", "tokio-macros"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = "0.3.12"
zbus = "6.0.0"
